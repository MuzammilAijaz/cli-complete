[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["main.py", "train.py", "eval_benchmark.py"]
exclude = ["data*", "configs*"]

[project]
name = "cli-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "torchao>=0.16.0",
    "transformers>=4.50.0,<5.0.0",
    "peft==0.17.1",
    "trl==0.29.1",
    "accelerate>=0.40.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.2.0",
    "huggingface-hub>=0.26.0",
    "inquirer>=3.4.1",
    "numpy<2.1.0",
    "pandas>=2.2.2,<3.0.0",
    "safetensors>=0.4.5",
]
